name: 새벽말씀동행 영상 링크

on:
  schedule:
    # 한국시간 화~토 오전 6:10, 7:10, 9:10 (UTC 기준 전날 21·22·0시)
    - cron: "10 21,22 * * 1-5"
    - cron: "10 0 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dawn
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 영상 링크 붙이기
        run: python3 scripts/dawn_patch.py index.html
      - name: 바뀌었으면 올리기
        run: |
          if git diff --quiet; then echo "변경 없음"; exit 0; fi
          git config user.name "dawn-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "새벽말씀동행 영상 링크 자동 추가"
          git push
